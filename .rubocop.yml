plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  TargetRailsVersion: 7.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - bin/**/*
    - db/schema.rb
    - db/migrate/**/*
    - node_modules/**/*
    - public/**/*
    - tmp/**/*
    - vendor/**/*

# Project style choices that diverge from defaults.

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - lib/tasks/**/*
    - config/**/*

# Multi-expectation specs are normal and often clearer than splitting one
# behavioral test across multiple `it` blocks that share setup.
RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Max: 10

# Defaults of 10 / 17 are too punishing for legitimate seed-loader code
# that's intentionally linear (map_payload, fetch_all, run).
Metrics/MethodLength:
  Max: 30
Metrics/AbcSize:
  Max: 40
Metrics/CyclomaticComplexity:
  Max: 20
Metrics/PerceivedComplexity:
  Max: 20
Metrics/ClassLength:
  Max: 200

# Long Hash#dig chains over external JSON are readable; the alternative
# (intermediate variables for every step) is worse.
Style/SafeNavigationChainLength:
  Enabled: false
